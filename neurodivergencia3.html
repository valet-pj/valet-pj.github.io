<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/neurodivergencia3.css">
</head>
<body>
    <section>
        <h1>Participa </h1>
        <h2>Únete a nuestra comunidad</h2>
        <p>Regístrate para participar en nuestros talleres, foros de discusión y grupos de apoyo mutuo.</p>
        
        <form action="#" method="POST">
            <p>
                <label for="nombre-participa">Nombre completo:</label><br>
                <input type="text" id="nombre-participa" name="nombre-participa" required>
            </p>
            <p>
                <label for="actividad">¿En qué te gustaría participar?</label><br>
                <input type="text" id="actividad" name="actividad" placeholder="Ej. Talleres artísticos, Charlas informativas">
            </p>
            <p>
                <input type="submit" value="Enviar Registro">
            </p>
        </form>
    </section>

    <hr>
</body>
</html>
