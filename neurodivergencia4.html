<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/neurodivergencia4.css">
</head>
<body>
    <section>
        <h1>Contacto <h1>
        <h2>Ponte en contacto con nosotros</h2>
        <p>Si tienes dudas, sugerencias o necesitas orientación personalizada, déjanos un mensaje.</p>
        
        <form action="#" method="POST">
            <p>
                <label for="email-contacto">Correo electrónico:</label><br>
                <input type="email" id="email-contacto" name="email-contacto" placeholder="nombre@correo.com" required>
            </p>
            <p>
                <label for="mensaje">Tu mensaje o consulta:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="40" placeholder="Escribe aquí tu duda..."></textarea>
            </p>
            <p>
                <input type="submit" value="Enviar Mensaje">
            </p>
        </form>
    </section>

</body>
</html>
